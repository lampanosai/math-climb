<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Climb</title>
<meta name="description" content="A timed math game: addition, subtraction, multiplication, division, MDAS and PEMDAS.">
<meta name="theme-color" content="#1E2A4A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F9FE; --grid:#DCE7F6; --ink:#1E2A4A; --soft:#56627F;
  --marker:#FFC53D; --go:#1F9D63; --oops:#E5484D; --sky:#2F6FED; --card:#FFFFFF;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; color:var(--ink);
  font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  -webkit-tap-highlight-color:transparent;
}
main{max-width:520px; margin:0 auto; padding:18px 16px 32px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--sky); outline-offset:3px}

/* Home */
.top{display:flex; justify-content:space-between; align-items:flex-start; margin-top:6px}
.logo{margin:0; font-size:clamp(50px,15vw,70px); line-height:.88; font-weight:800; letter-spacing:-1px}
.logo .w{display:block}
.climb{display:block; padding-top:14px}
.climb i{display:inline-block; font-style:normal; transform:translateY(calc(var(--i) * -7px))}
.icon-btn{width:46px; height:46px; flex:none; border-radius:50%; border:2px solid var(--ink);
  background:var(--card); font-size:20px; display:grid; place-items:center; padding:0}
.lead{color:var(--soft); font-size:19px; line-height:1.35; margin:14px 0 18px}
.attack{display:block; width:100%; text-align:left; background:var(--marker); border:2px solid var(--ink);
  border-radius:18px; padding:14px 18px; box-shadow:4px 4px 0 var(--ink); transition:transform .08s, box-shadow .08s}
.attack:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink)}
.attack-title{display:block; font-size:26px; font-weight:800; line-height:1.1}
.attack-sub{display:block; font-size:16px; line-height:1.3}
.attack-best{display:block; font-size:16px; font-weight:800; margin-top:4px}
.trail{list-style:none; margin:26px 0 0; padding:0; position:relative}
.trail::before{content:""; position:absolute; left:23px; top:26px; bottom:26px; border-left:3px dashed var(--ink); opacity:.3}
.trail li{margin:0 0 12px}
.lvl{width:100%; display:flex; align-items:center; gap:12px; text-align:left; background:none; border:0; padding:0}
.num{position:relative; z-index:1; width:44px; height:44px; flex:none; border-radius:50%; background:var(--card);
  border:3px solid var(--ink); display:grid; place-items:center; font-weight:800; font-size:19px}
.lvl.done .num{background:var(--go); border-color:var(--go); color:#fff}
.lvl-card{flex:1; min-width:0; display:flex; align-items:center; gap:10px; background:var(--card);
  border:2px solid var(--ink); border-radius:14px; padding:10px 14px; box-shadow:3px 3px 0 var(--ink);
  transition:transform .08s, box-shadow .08s}
.lvl:active .lvl-card{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.lvl-text{flex:1; min-width:0}
.lvl-name{display:block; font-size:21px; font-weight:800; line-height:1.15}
.lvl-blurb{display:block; font-size:15px; color:var(--soft); line-height:1.3}
.stars{font-size:19px; letter-spacing:1px; color:#C9D3E3; flex:none}
.stars b,.big-stars b{color:#F5B400; font-weight:inherit}
.reset{display:block; margin:22px auto 0; background:none; border:0; color:var(--soft); text-decoration:underline; font-size:15px}

/* Play */
.play-top{display:flex; align-items:center; gap:12px}
.play-info{flex:1; min-width:0}
#playLevel{display:block; font-weight:800; font-size:21px; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#playCount{display:block; color:var(--soft); font-size:15px}
.score{font-weight:800; font-size:19px; background:var(--card); border:2px solid var(--ink); border-radius:999px; padding:2px 14px; white-space:nowrap}
.timer{margin-top:14px; height:16px; border:2px solid var(--ink); border-radius:999px; background:var(--card); overflow:hidden}
#timerFill{height:100%; width:100%; background:var(--sky)}
.timer.warn #timerFill{background:var(--oops)}
.timer-text{text-align:right; font-weight:800; font-size:16px; color:var(--soft); margin-top:2px; font-variant-numeric:tabular-nums}
.timer-text.warn{color:var(--oops)}
.board{background:var(--card); border:2px solid var(--ink); border-radius:20px; box-shadow:4px 4px 0 var(--ink);
  padding:22px 16px 16px; margin-top:6px; text-align:center}
.question{font-size:clamp(36px,11vw,54px); font-weight:800; line-height:1.2}
.question.long{font-size:clamp(26px,7.6vw,40px)}
sup{font-size:.58em; vertical-align:super; line-height:0}
.answer{margin:12px auto 0; min-width:140px; max-width:220px; font-size:44px; font-weight:800; line-height:1.2;
  border-bottom:4px solid var(--ink); padding:0 10px; font-variant-numeric:tabular-nums}
.answer.empty{color:#B8C3D6}
.answer.right{color:var(--go); border-color:var(--go)}
.answer.wrong{color:var(--oops); border-color:var(--oops)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{min-height:30px; margin-top:10px; font-size:20px; font-weight:800; line-height:1.3}
.feedback.good{color:var(--go)}
.feedback.bad{color:var(--oops)}
.feedback.good{font-size:23px}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.6); opacity:0}60%{transform:scale(1.15); opacity:1}100%{transform:scale(1)}}
.steps-tip{font-size:16px !important; font-weight:700 !important; color:var(--go); margin-top:4px !important}
.steps{margin-top:10px; text-align:left; background:var(--paper); border-radius:12px; padding:10px 14px}
.steps-title{font-weight:800; font-size:16px; margin:0 0 2px}
.steps p{margin:0; display:flex; justify-content:space-between; align-items:baseline; gap:4px 12px; flex-wrap:wrap; font-size:21px; font-weight:700; line-height:1.55}
.steps .note{color:var(--soft); font-size:15px; font-weight:600}
.pad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px}
.pad button{height:58px; font-size:27px; font-weight:800; border:2px solid var(--ink); border-radius:14px;
  background:var(--card); box-shadow:3px 3px 0 var(--ink); touch-action:manipulation; padding:0}
.pad button:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.pad .check{background:var(--go); color:#fff; font-size:21px}
.primary,.secondary{display:block; width:100%; margin-top:14px; height:58px; font-size:22px; font-weight:800;
  border:2px solid var(--ink); border-radius:14px; box-shadow:3px 3px 0 var(--ink); touch-action:manipulation}
.primary{background:var(--sky); color:#fff}
.secondary{background:var(--marker)}
.primary:active,.secondary:active{transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink)}
.ghost{display:block; margin:16px auto 0; background:none; border:0; text-decoration:underline; font-weight:700; font-size:18px}

/* Results */
#results{text-align:center; padding-top:36px}
#resTitle{font-size:46px; margin:0; line-height:1}
.big-stars{font-size:66px; letter-spacing:6px; margin:10px 0 6px; color:#C9D3E3; line-height:1}
#resLine{font-size:21px; margin:0; line-height:1.35}
#resBest{color:var(--soft); font-size:17px; margin:6px 0 0}
.res-actions{max-width:360px; margin:20px auto 0}

@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>
<main>

<section id="home" class="screen">
  <div class="top">
    <h1 class="logo" aria-label="Math Climb"><span class="w" aria-hidden="true">Math</span><span class="climb" aria-hidden="true"><i style="--i:0">C</i><i style="--i:1">l</i><i style="--i:2">i</i><i style="--i:3">m</i><i style="--i:4">b</i></span></h1>
    <button id="muteBtn" class="icon-btn" type="button"></button>
  </div>
  <p class="lead">Pick a level and answer before the timer runs out.</p>
  <button id="attackBtn" class="attack" type="button">
    <span class="attack-title">Beat the clock</span>
    <span class="attack-sub" id="attackSub"></span>
    <span class="attack-best" id="attackBest"></span>
  </button>
  <ol id="levelList" class="trail"></ol>
  <button id="resetBtn" class="reset" type="button">Clear my stars and scores</button>
</section>

<section id="play" class="screen" hidden>
  <div class="play-top">
    <button id="quitBtn" class="icon-btn" type="button" aria-label="Back to levels">✕</button>
    <div class="play-info"><span id="playLevel"></span><span id="playCount"></span></div>
    <div class="score" id="playScore"></div>
  </div>
  <div class="timer" id="timer" aria-hidden="true"><div id="timerFill"></div></div>
  <div class="timer-text" id="timerText"></div>
  <div class="board">
    <div id="question" class="question"></div>
    <div id="answer" class="answer" aria-live="polite"></div>
    <div id="feedback" class="feedback" aria-live="assertive"></div>
    <div id="steps" class="steps" hidden></div>
  </div>
  <div id="pad" class="pad"></div>
  <button id="nextBtn" class="primary" type="button" hidden>Next question</button>
</section>

<section id="results" class="screen" hidden>
  <h2 id="resTitle"></h2>
  <div id="resStars" class="big-stars"></div>
  <p id="resLine"></p>
  <p id="resBest"></p>
  <div class="res-actions">
    <button id="againBtn" class="primary" type="button">Play again</button>
    <button id="nextLevelBtn" class="secondary" type="button">Next level</button>
    <button id="homeBtn" class="ghost" type="button">All levels</button>
  </div>
</section>

</main>
<script>
const CONFIG = {"levels": [{"gen": "add", "name": "Addition", "blurb": "Add two numbers", "seconds": 15}, {"gen": "sub", "name": "Subtraction", "blurb": "Take one number away from another", "seconds": 15}, {"gen": "mul", "name": "Multiplication", "blurb": "Times tables up to 12", "seconds": 15}, {"gen": "div", "name": "Division", "blurb": "Split into equal groups", "seconds": 20}, {"gen": "mix", "name": "Mixed four", "blurb": "Add, subtract, multiply and divide", "seconds": 20}, {"gen": "mdas", "name": "MDAS", "blurb": "Multiply and divide before you add and subtract", "seconds": 40}, {"gen": "pemdas", "name": "PEMDAS", "blurb": "Solve the parentheses first", "seconds": 50}, {"gen": "champ", "name": "Champion", "blurb": "Two-step PEMDAS problems", "seconds": 60}], "questions": 10, "attackSeconds": 60, "bonusSeconds": 2, "attackStep": 4, "stars": [0.6, 0.8, 1.0], "maxValue": 999, "praise": ["Great job!", "Excellent!", "Awesome!", "You got it!", "Super!", "Way to go!", "Brilliant!", "Nice work!", "Fantastic!", "Math star!"], "praiseSecond": ["Nice, you got it!", "Good thinking!", "You figured it out!", "Way to keep trying!"], "praiseStreak": ["You're on fire!", "Unstoppable!", "Keep it up!", "Wow, what a streak!"]};
const LEVELS = CONFIG.levels;
const STORE_KEY = "mathclimb:v1";

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lerp = (a, b, t) => Math.round(a + (b - a) * t);

/* ---------------- Solver: works a problem out step by step ---------------- */
const VERB = {"^": "Exponent", "*": "Multiply", "/": "Divide", "+": "Add", "-": "Subtract"};

function applyOp(a, op, b) {
  let r;
  if (op === "+") r = a + b;
  else if (op === "-") r = a - b;
  else if (op === "*") r = a * b;
  else if (op === "/") { if (b === 0 || a % b !== 0) return null; r = a / b; }
  else if (op === "^") { if (b > 3) return null; r = Math.pow(a, b); }
  if (r < 0 || r > CONFIG.maxValue) return null;
  return r;
}
function reduceFlat(seg) {
  let i = seg.indexOf("^");
  if (i < 0) i = seg.findIndex(t => t === "*" || t === "/");
  if (i < 0) i = seg.findIndex(t => t === "+" || t === "-");
  if (i < 1) return null;
  const r = applyOp(seg[i - 1], seg[i], seg[i + 1]);
  if (r === null) return null;
  return {seg: [...seg.slice(0, i - 1), r, ...seg.slice(i + 2)], op: seg[i]};
}
function reduceOnce(tokens) {
  const close = tokens.indexOf(")");
  if (close >= 0) {
    const open = tokens.lastIndexOf("(", close);
    const inner = tokens.slice(open + 1, close);
    if (inner.length === 1) return {tokens: [...tokens.slice(0, open), inner[0], ...tokens.slice(close + 1)], op: null, paren: true};
    const r = reduceFlat(inner);
    if (!r) return null;
    const out = r.seg.length === 1
      ? [...tokens.slice(0, open), r.seg[0], ...tokens.slice(close + 1)]
      : [...tokens.slice(0, open + 1), ...r.seg, ...tokens.slice(close)];
    return {tokens: out, op: r.op, paren: true};
  }
  const r = reduceFlat(tokens);
  return r ? {tokens: r.seg, op: r.op, paren: false} : null;
}
function solve(tokens) {
  const steps = [{tokens, note: ""}];
  let cur = tokens;
  for (let guard = 0; cur.length > 1 && guard < 30; guard++) {
    const r = reduceOnce(cur);
    if (!r) return null;
    cur = r.tokens;
    const note = r.op ? (r.paren ? "Parentheses: " + VERB[r.op].toLowerCase() : VERB[r.op]) : "";
    steps.push({tokens: cur, note});
  }
  if (cur.length !== 1) return null;
  return {answer: cur[0], steps};
}

/* ---------------- Question makers, one per level type ---------------- */
function divPair(maxDiv, maxQ) { const b = rand(2, maxDiv), q = rand(1, maxQ); return [b * q, b]; }

const GEN = {
  add(t) { const hi = lerp(10, 60, t); return [rand(1, hi), "+", rand(1, hi)]; },
  sub(t) { const hi = lerp(10, 60, t); const a = rand(2, hi); return [a, "-", rand(1, a)]; },
  mul(t) { const hi = lerp(5, 12, t); return [rand(2, hi), "*", rand(2, hi)]; },
  div(t) { const [a, b] = divPair(lerp(5, 12, t), lerp(5, 12, t)); return [a, "/", b]; },
  mix(t) { return GEN[pick(["add", "sub", "mul", "div"])](Math.min(1, t + 0.3)); },
  mdas(t) {
    const s = lerp(4, 7, t), n = () => rand(1, s), m = () => rand(2, s);
    const two = [
      () => [n(), "+", m(), "*", m()],
      () => [m(), "*", m(), "-", n()],
      () => { const [a, b] = divPair(5, 5); return [a, "/", b, "+", n()]; },
      () => [rand(10, 30), "-", m(), "*", m()],
      () => { const [a, b] = divPair(5, 5); return [n(), "+", a, "/", b]; },
    ];
    const three = [
      () => [n(), "+", m(), "*", m(), "-", n()],
      () => [m(), "*", m(), "+", m(), "*", m()],
      () => [rand(10, 30), "-", m(), "*", m(), "+", n()],
    ];
    return pick(t < 0.5 || Math.random() < 0.5 ? two : three)();
  },
  // PEMDAS for younger students: small numbers, parentheses first, a few easy squares.
  pemdas(t) {
    const n = () => rand(1, 5), m = () => rand(2, 4);
    const easy = [
      () => ["(", n(), "+", n(), ")", "*", m()],
      () => [m(), "*", "(", n(), "+", n(), ")"],
      () => { const a = rand(4, 9); return ["(", a, "-", rand(1, a - 1), ")", "*", m()]; },
      () => { const c = m(), q = rand(1, 4), a = rand(1, c * q - 1); return ["(", a, "+", c * q - a, ")", "/", c]; },
      () => [rand(10, 20), "-", "(", n(), "+", n(), ")"],
      () => [n(), "+", "(", m(), "*", m(), ")"],
    ];
    const squares = [
      () => [rand(2, 5), "^", 2, "+", n()],
      () => [rand(2, 5), "^", 2, "-", n()],
      () => ["(", rand(1, 3), "+", rand(1, 2), ")", "^", 2],
    ];
    return pick(t < 0.4 || Math.random() < 0.65 ? easy : squares)();
  },
  champ(t) {
    const n = () => rand(1, 5), m = () => rand(2, 4);
    return pick([
      () => ["(", n(), "+", n(), ")", "*", m(), "-", n()],
      () => [n(), "+", m(), "*", "(", rand(3, 6), "-", rand(1, 2), ")"],
      () => ["(", rand(6, 10), "-", n(), ")", "*", m(), "+", n()],
      () => [rand(2, 5), "^", 2, "+", "(", n(), "+", n(), ")"],
      () => [rand(3, 5), "^", 2, "-", m(), "*", m()],
      () => { const c = m(), q = rand(1, 5), a = rand(1, c * q - 1); return ["(", a, "+", c * q - a, ")", "/", c, "+", n()]; },
    ])();
  },
};

function makeQuestion(gen, t, seen) {
  let fallback = null;
  for (let k = 0; k < 500; k++) {
    const tokens = GEN[gen](t);
    const sol = solve(tokens);
    if (!sol) continue;
    const q = {tokens, answer: sol.answer, steps: sol.steps, key: tokens.join(" ")};
    if (!seen.has(q.key)) { seen.add(q.key); return q; }
    fallback = fallback || q;
  }
  if (fallback) return fallback;
  const a = rand(1, 10), b = rand(1, 10);
  return {tokens: [a, "+", b], answer: a + b, steps: [{tokens: [a, "+", b], note: ""}, {tokens: [a + b], note: "Add"}], key: ""};
}

/* ---------------- Drawing problems ---------------- */
const SYM = {"+": "+", "-": "−", "*": "×", "/": "÷"};
function render(tokens) {
  let out = "";
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === "^") out += "<sup>" + tokens[++i] + "</sup>";
    else if (t === "(" || t === ")") out += t;
    else if (SYM[t]) out += " " + SYM[t] + " ";
    else out += t;
  }
  return out;
}
function speakable(tokens) {
  const words = {"+": "plus", "-": "minus", "*": "times", "/": "divided by", "(": "open bracket", ")": "close bracket"};
  const out = [];
  for (let i = 0; i < tokens.length; i++) {
    const t = tokens[i];
    if (t === "^") { out.push(tokens[++i] === 2 ? "squared" : "to the power of " + tokens[i]); }
    else out.push(words[t] || String(t));
  }
  return out.join(" ");
}
function starsHTML(n) { return "<b>" + "★".repeat(n) + "</b>" + "★".repeat(3 - n); }

/* ---------------- Saved progress ---------------- */
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; }
}
const store = loadStore();
store.stars = store.stars || {};
store.best = store.best || {};
function saveStore() { try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {} }

/* ---------------- Sound ---------------- */
let audioCtx = null;
function tone(freq, dur, when = 0, type = "sine", vol = 0.15) {
  if (store.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t0 = audioCtx.currentTime + when;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch (e) {}
}
const SFX = {
  tap: () => tone(700, 0.05, 0, "triangle", 0.05),
  right: () => { tone(660, 0.12); tone(990, 0.2, 0.1); },
  wrong: () => tone(200, 0.25, 0, "square", 0.06),
  tick: () => tone(1250, 0.05, 0, "square", 0.035),
  timeup: () => { tone(392, 0.18, 0, "sawtooth", 0.05); tone(262, 0.32, 0.16, "sawtooth", 0.05); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, i * 0.12, "triangle", 0.12)),
};
function drawMute() {
  $("muteBtn").textContent = store.muted ? "🔇" : "🔊";
  $("muteBtn").setAttribute("aria-label", store.muted ? "Turn sound on" : "Turn sound off");
}

/* ---------------- Screens ---------------- */
function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.hidden = s.id !== id);
  window.scrollTo(0, 0);
}
function drawHome() {
  $("attackSub").textContent = CONFIG.attackSeconds + " seconds. Every right answer adds " + CONFIG.bonusSeconds + " more.";
  const best = store.best.attack;
  $("attackBest").textContent = best ? "Your best: " + best + " right" : "";
  $("levelList").innerHTML = LEVELS.map((lv, i) => {
    const st = store.stars[i] || 0;
    return '<li><button class="lvl' + (st ? " done" : "") + '" type="button" data-i="' + i + '" aria-label="Level ' + (i + 1) + ", " + lv.name + ", " + st + ' of 3 stars">' +
      '<span class="num">' + (i + 1) + '</span><span class="lvl-card"><span class="lvl-text">' +
      '<span class="lvl-name">' + lv.name + '</span><span class="lvl-blurb">' + lv.blurb + ". " + lv.seconds + " seconds each.</span>" +
      '</span><span class="stars" aria-hidden="true">' + starsHTML(st) + "</span></span></button></li>";
  }).join("");
  show("home");
}

/* ---------------- Game state + timer ---------------- */
const S = {mode: null, level: 0, qIndex: 0, correct: 0, score: 0, q: null, tries: 0, input: "",
           locked: false, streak: 0, seen: new Set(), deadline: 0, limit: 1, timerId: null, lastSec: null, pausedLeft: null};

function stopTimer() { clearInterval(S.timerId); S.timerId = null; }
function pauseTimer() { S.pausedLeft = Math.max(0, S.deadline - Date.now()); stopTimer(); }
function runTimer(ms) {
  stopTimer();
  S.deadline = Date.now() + ms;
  S.lastSec = null;
  S.timerId = setInterval(tick, 100);
  tick();
}
function tick() {
  const left = Math.max(0, S.deadline - Date.now());
  const frac = Math.min(1, left / S.limit);
  const warn = S.mode === "attack" ? left <= 10000 : (left <= 3000 || frac <= 0.25);
  $("timerFill").style.width = (frac * 100) + "%";
  $("timer").classList.toggle("warn", warn);
  $("timerText").classList.toggle("warn", warn);
  const sec = Math.ceil(left / 1000);
  $("timerText").textContent = sec + (sec === 1 ? " second" : " seconds");
  if (sec !== S.lastSec) { if (sec <= 3 && sec > 0) SFX.tick(); S.lastSec = sec; }
  if (left <= 0) timeUp();
}

/* ---------------- Playing ---------------- */
function startLevel(i) {
  Object.assign(S, {mode: "level", level: i, qIndex: 0, correct: 0, score: 0, streak: 0});
  S.seen.clear();
  show("play");
  nextQuestion();
}
function startAttack() {
  Object.assign(S, {mode: "attack", qIndex: 0, correct: 0, score: 0, streak: 0, pausedLeft: CONFIG.attackSeconds * 1000});
  S.limit = CONFIG.attackSeconds * 1000;
  S.seen.clear();
  show("play");
  nextQuestion();
}
function drawScore() {
  $("playScore").textContent = S.mode === "attack" ? S.correct + " right" : S.score + " pts";
}
function nextQuestion() {
  let lv, t;
  if (S.mode === "level") {
    if (S.qIndex >= CONFIG.questions) return finishLevel();
    lv = LEVELS[S.level];
    t = CONFIG.questions > 1 ? S.qIndex / (CONFIG.questions - 1) : 0.5;
    $("playLevel").textContent = lv.name;
    $("playCount").textContent = "Level " + (S.level + 1) + ", question " + (S.qIndex + 1) + "/" + CONFIG.questions;
  } else {
    const step = Math.min(LEVELS.length - 1, Math.floor(S.correct / CONFIG.attackStep));
    lv = LEVELS[step];
    t = Math.random();
    $("playLevel").textContent = "Beat the clock";
    $("playCount").textContent = "Now: " + lv.name;
  }
  S.q = makeQuestion(lv.gen, t, S.seen);
  S.tries = 0; S.input = ""; S.locked = false;
  const q = $("question");
  q.innerHTML = render(S.q.tokens);
  q.setAttribute("aria-label", speakable(S.q.tokens));
  q.classList.toggle("long", S.q.tokens.length > 7);
  $("feedback").textContent = ""; $("feedback").className = "feedback";
  $("steps").hidden = true;
  $("nextBtn").hidden = true;
  $("pad").hidden = false;
  drawAnswer(); drawScore();
  if (S.mode === "level") { S.limit = lv.seconds * 1000; runTimer(S.limit); }
  else { runTimer(S.pausedLeft); S.pausedLeft = null; }
}
function drawAnswer(state) {
  const a = $("answer");
  a.textContent = S.input || "?";
  a.className = "answer" + (S.input ? "" : " empty") + (state ? " " + state : "");
}
function press(k) {
  if (S.locked) return;
  if (k === "enter") return submit();
  if (k === "back") S.input = S.input.slice(0, -1);
  else if (S.input.length < 4) S.input = (S.input === "0" ? "" : S.input) + k;
  SFX.tap();
  drawAnswer();
}
function submit() {
  if (S.locked || S.input === "") return;
  if (parseInt(S.input, 10) === S.q.answer) onRight(); else onWrong();
}
function onRight() {
  S.locked = true;
  const left = Math.max(0, S.deadline - Date.now());
  S.correct++;
  S.streak++;
  SFX.right();
  drawAnswer("right");
  const fb = $("feedback");
  fb.className = "feedback good";
  void fb.offsetWidth; fb.classList.add("pop");
  const cheer = S.streak >= 3 && S.streak % 3 === 0
    ? S.streak + " in a row! " + pick(CONFIG.praiseStreak)
    : pick(S.tries === 0 ? CONFIG.praise : CONFIG.praiseSecond);
  if (S.mode === "level") {
    stopTimer();
    const pts = S.tries === 0 ? 10 + Math.ceil((left / S.limit) * 10) : 5;
    S.score += pts;
    fb.textContent = cheer + " +" + pts + " points";
  } else {
    S.deadline += CONFIG.bonusSeconds * 1000;
    pauseTimer();
    fb.textContent = cheer + " +" + CONFIG.bonusSeconds + " seconds";
  }
  drawScore();
  setTimeout(() => { if (S.mode === "level") S.qIndex++; nextQuestion(); }, 1100);
}
function onWrong() {
  if (S.mode === "level" && S.tries === 0) {
    S.tries = 1;
    SFX.wrong();
    S.input = "";
    drawAnswer();
    const a = $("answer");
    a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake");
    $("feedback").className = "feedback bad";
    $("feedback").textContent = pick(["Almost! Try once more.", "So close! Have another go.", "Not quite. You can do it!"]);
    return;
  }
  reveal(false);
}
function timeUp() {
  if (S.locked) return;
  if (S.mode === "attack") return endAttack();
  reveal(true);
}
function reveal(timedOut) {
  S.locked = true;
  S.streak = 0;
  if (S.mode === "level") stopTimer(); else pauseTimer();
  timedOut ? SFX.timeup() : SFX.wrong();
  const fb = $("feedback");
  fb.className = "feedback bad";
  fb.textContent = (timedOut ? "Time's up! Good try. " : "Good try! ") + "The answer is " + S.q.answer + ".";
  if (!timedOut) drawAnswer("wrong");
  const steps = S.q.steps;
  let html = '<p class="steps-title">How to solve it</p>';
  if (steps.length === 2) {
    html += "<p><span>" + render(steps[0].tokens) + " = " + steps[1].tokens[0] + "</span></p>";
  } else {
    html += "<p><span>" + render(steps[0].tokens) + "</span></p>";
    for (let i = 1; i < steps.length; i++) {
      html += '<p><span>= ' + render(steps[i].tokens) + '</span><span class="note">' + steps[i].note + "</span></p>";
    }
  }
  html += '<p class="steps-tip">Now you know how. You\'ll get the next one!</p>';
  $("steps").innerHTML = html;
  $("steps").hidden = false;
  $("pad").hidden = true;
  const last = S.mode === "level" && S.qIndex >= CONFIG.questions - 1;
  $("nextBtn").textContent = last ? "See results" : (S.mode === "attack" ? "Keep going" : "Next question");
  $("nextBtn").hidden = false;
  $("nextBtn").focus({preventScroll: true});
}
function goNext() {
  if ($("nextBtn").hidden) return;
  $("nextBtn").hidden = true;
  if (S.mode === "level") S.qIndex++;
  nextQuestion();
}
function finishLevel() {
  stopTimer();
  const share = S.correct / CONFIG.questions;
  const stars = share >= CONFIG.stars[2] ? 3 : share >= CONFIG.stars[1] ? 2 : share >= CONFIG.stars[0] ? 1 : 0;
  const i = S.level;
  const newBest = S.score > (store.best[i] || 0);
  store.stars[i] = Math.max(store.stars[i] || 0, stars);
  if (newBest) store.best[i] = S.score;
  saveStore();
  if (stars) SFX.win(); else SFX.timeup();
  $("resTitle").textContent = ["Good practice!", "Well done!", "Great job!", "Amazing!"][stars];
  $("resStars").innerHTML = starsHTML(stars);
  $("resStars").setAttribute("aria-label", stars + " of 3 stars");
  $("resLine").textContent = "You got " + S.correct + " of " + CONFIG.questions + " right and scored " + S.score + " points." +
    (stars === 3 ? " A perfect score!" : stars ? "" : " Every try makes you better. Play again?");
  $("resBest").textContent = newBest ? "That's your best score on this level." : "Your best on this level: " + store.best[i] + " points.";
  $("nextLevelBtn").hidden = i >= LEVELS.length - 1;
  show("results");
}
function endAttack() {
  stopTimer();
  S.locked = true;
  const best = store.best.attack || 0;
  const newBest = S.correct > best;
  if (newBest) { store.best.attack = S.correct; saveStore(); }
  SFX.win();
  $("resTitle").textContent = S.correct >= 10 ? "Amazing!" : S.correct >= 5 ? "Great job!" : "Good practice!";
  $("resStars").innerHTML = "";
  $("resLine").textContent = "You answered " + S.correct + (S.correct === 1 ? " question" : " questions") + " right.";
  $("resBest").textContent = newBest ? "That's a new best!" : "Your best: " + best + " right.";
  $("nextLevelBtn").hidden = true;
  show("results");
}
function quit() {
  stopTimer();
  S.locked = true;
  drawHome();
}

/* ---------------- Wiring ---------------- */
$("pad").innerHTML = ["1","2","3","4","5","6","7","8","9","back","0","enter"].map(k =>
  k === "back" ? '<button type="button" data-k="back" aria-label="Delete">⌫</button>'
  : k === "enter" ? '<button type="button" data-k="enter" class="check">Check</button>'
  : '<button type="button" data-k="' + k + '">' + k + "</button>").join("");
$("pad").addEventListener("click", e => { const b = e.target.closest("button"); if (b) press(b.dataset.k); });
$("levelList").addEventListener("click", e => { const b = e.target.closest(".lvl"); if (b) startLevel(+b.dataset.i); });
$("attackBtn").addEventListener("click", startAttack);
$("nextBtn").addEventListener("click", goNext);
$("quitBtn").addEventListener("click", quit);
$("homeBtn").addEventListener("click", drawHome);
$("againBtn").addEventListener("click", () => S.mode === "attack" ? startAttack() : startLevel(S.level));
$("nextLevelBtn").addEventListener("click", () => startLevel(S.level + 1));
$("muteBtn").addEventListener("click", () => { store.muted = !store.muted; saveStore(); drawMute(); });
$("resetBtn").addEventListener("click", () => {
  if (!confirm("Clear all stars and best scores on this device?")) return;
  store.stars = {}; store.best = {}; saveStore(); drawHome();
});
document.addEventListener("keydown", e => {
  if ($("play").hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); press(e.key); }
  else if (e.key === "Backspace") { e.preventDefault(); press("back"); }
  else if (e.key === "Enter") { e.preventDefault(); if (!$("nextBtn").hidden) goNext(); else press("enter"); }
  else if (e.key === "Escape") quit();
});

drawMute();
drawHome();

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
